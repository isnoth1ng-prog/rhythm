name: Rhythm
options:
  bundleIdPrefix: com.isnoth1ng
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  Rhythm:
    type: application
    platform: iOS
    sources:
      - path: Rhythm
    resources:
      - path: Rhythm/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isnoth1ng.rhythm
        INFOPLIST_FILE: Rhythm/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: Rhythm/Info.plist
      properties:
        CFBundleDisplayName: Rhythm
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSAppleMusicUsageDescription: "Rhythm uses Apple Music to search, play music, access your library and build personalized recommendations."
        UIBackgroundModes:
          - audio
        LSRequiresIPhoneOS: true
